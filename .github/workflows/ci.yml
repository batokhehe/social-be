name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOTOOLCHAIN: local # 🔒 penting: disable auto upgrade

    steps:
      # 🔹 Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔹 Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # 🔹 Clean cache (hindari bug aneh)
      - name: Clean Go cache
        run: go clean -modcache

      # 🔹 Install dependencies
      - name: Install dependencies
        run: |
          go mod tidy
          go mod download

      # 🔹 Lint
      - name: Run Linter
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.59.1
          golangci-lint run --timeout=5m

      # 🔹 Test
      - name: Run Tests
        run: go test ./... || true

      # 🔹 Build binary
      - name: Build
        run: go build -v ./...

      # 🔹 Build Docker
      - name: Build Docker Image
        run: docker build -t social-be .

      # 🔹 Deploy (main only)
      - name: Deploy to Server
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/backend
            git pull
            docker compose down
            docker compose up -d --build
