info:
  contact: {}
  description: API documentation
  title: Social BE API
  version: "1.0"
paths:
  /admin/users:
    post:
      consumes:
      - application/json
      description: Create new user account by superadmin
      parameters:
      - description: Create user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - users
  /dashboard/donations-by-category:
    get:
      description: Returns current-month money donations grouped by donation category,
        each with its summed amount, plus the grand total. Percentages are left to
        the frontend. Intended for a pie chart.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Donations by category (pie chart)
      tags:
      - dashboard
  /dashboard/home:
    get:
      description: 'Returns homepage widgets: ongoing activities, latest donations,
        top volunteers (by contribution hours), and the impact summary (active volunteers,
        and completed activities = events whose end_at is in the past).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Dashboard homepage widgets
      tags:
      - dashboard
  /dashboard/summary:
    get:
      description: 'Returns dashboard KPI cards: total money donation, active donors
        and active volunteers (current vs previous month with percentage), plus the
        upcoming active event count.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Dashboard summary KPIs
      tags:
      - dashboard
  /donations:
    get:
      description: Get list of donations, optionally filtered by type (0=money, 1=goods)
      parameters:
      - description: 'Filter by donation type: 0 = money, 1 = goods'
        in: query
        name: type
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all donations
      tags:
      - donation
    post:
      consumes:
      - application/json
      description: Create new donation
      parameters:
      - description: Create donation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/donation.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create donation
      tags:
      - donation
  /donations/{id}:
    delete:
      description: Delete donation
      parameters:
      - description: Donation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete donation
      tags:
      - donation
    get:
      description: Get detail donation
      parameters:
      - description: Donation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get donation by ID
      tags:
      - donation
    put:
      consumes:
      - application/json
      description: Update existing donation
      parameters:
      - description: Donation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update donation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/donation.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update donation
      tags:
      - donation
  /donations/import:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload an Excel (.xlsx) file of donation records. Each row is
        validated and created independently; one bad row does not stop the rest.
        Use dry_run=true to validate without writing any data.
      parameters:
      - description: Excel file (.xlsx)
        in: formData
        name: file
        required: true
        type: file
      - description: Validate only, do not insert
        in: query
        name: dry_run
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Import donations from Excel
      tags:
      - donation
  /donations/import/{batch_id}:
    delete:
      description: Delete every donation created by a given import batch.
      parameters:
      - description: Import batch id
        in: path
        name: batch_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Rollback an import batch
      tags:
      - donation
  /donations/imports:
    get:
      description: Filtered, sorted, paginated import history (SuperAdmin/Admin).
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Sort column
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      - description: Filter by batch id
        in: query
        name: batch_id
        type: string
      - description: Filter by filename (partial)
        in: query
        name: filename
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by uploader user id
        in: query
        name: uploaded_by
        type: integer
      - description: Filter by period
        in: query
        name: period
        type: string
      - description: Uploaded from (date)
        in: query
        name: uploaded_at_from
        type: string
      - description: Uploaded to (date)
        in: query
        name: uploaded_at_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List import history
      tags:
      - donation
  /donations/imports/{batch_id}:
